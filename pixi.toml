# Native tools for developing and testing md-doc-converter. Python and its
# dependencies are managed by uv (pyproject.toml, uv.lock); the tasks wrap uv.
[workspace]
name = "md-doc-converter"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Converted Markdown depends on the Pandoc version; this is the version the tests expect.
pandoc = "==3.12.1"
nodejs = "24.*"
# pdftocairo: the PDF fallback for EMF/WMF drawings, required by the render tests.
poppler = "*"
uv = ">=0.13.4,<0.14"

[activation.env]
# Keep the renderer toolchain that `setup` installs inside the checkout.
MD_DOC_CONVERTER_HOME = "$PIXI_PROJECT_ROOT/.toolchain"

[tasks]
sync = "uv sync --locked"
setup = { cmd = "uv run --locked md-doc-converter setup", depends-on = ["sync"] }
doctor = { cmd = "uv run --locked md-doc-converter doctor", depends-on = ["sync"] }
format = { cmd = "uv run --locked ruff format src tests", depends-on = ["sync"] }
lint-ruff = { cmd = "uv run --locked ruff format --check src tests && uv run --locked ruff check src tests", depends-on = ["sync"] }
lint-ty = { cmd = "uv run --locked ty check src tests", depends-on = ["sync"] }
lint-pyrefly = { cmd = "uv run --locked pyrefly check", depends-on = ["sync"] }
lint = { depends-on = ["lint-ruff", "lint-ty", "lint-pyrefly"] }
# Unit and integration tests; they need Git and Pandoc but no renderer toolchain.
test = { cmd = "uv run --locked python -m tests core", depends-on = ["sync"] }
# Real HTML/PDF/EMF rendering; also needs LibreOffice on PATH.
test-render = { cmd = "uv run --locked python -m tests render", depends-on = ["setup"] }
test-all = { depends-on = ["test", "test-render"] }
build = "uv build"
# Refresh package-lock.json after editing the bundled package.json.
lock-npm = { cmd = "npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/", cwd = "src/md_doc_converter/toolchain" }
