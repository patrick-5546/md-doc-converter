from: markdown-implicit_figures-yaml_metadata_block+gfm_auto_identifiers
toc-depth: 6
filters:
  - "${.}/mermaid.lua"  # render Mermaid diagrams with mermaid-cli
  - "${.}/katex.js"  # render math with KaTeX (Pandoc runs .js filters with node)
  - "${.}/strip-colwidths.lua"  # auto-size table columns instead of equal-width
  - "${.}/table-code-pipes.lua"  # read `a\|b` in a table cell as GFM does
# Embed images, stylesheets and fonts, so the HTML works anywhere and printing it needs no
# network. katex.js adds KaTeX's stylesheet to a document with math. The renderer inlines the
# GitHub Markdown stylesheet, then style-overrides.css, the page header/footer and any extra
# stylesheet, with --include-in-header, which follows KaTeX's.
embed-resources: true
# Wrap body content in .markdown-body so the GitHub Markdown stylesheet's selectors apply
include-before-body: "${.}/markdown-body-open.html"
include-after-body: "${.}/markdown-body-close.html"
