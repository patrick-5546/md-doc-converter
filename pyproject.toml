[project]
name = "md-doc-converter"
version = "0.1.0"
description = "Convert Word, Excel and CSV documents to Markdown, and render Markdown to HTML and PDF"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["markdown", "docx", "excel", "csv", "pdf", "html", "pandoc", "mermaid", "katex"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    # DOCX alignment depends on this exact MarkItDown output (MarkItDown also pins mammoth).
    "markitdown[docx]==0.1.6",
    "openpyxl>=3.1.5",
    "typing-extensions>=4.4",
]

[project.scripts]
md-doc-converter = "md_doc_converter.__main__:main"

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pyrefly]
preset = "strict"
search-path = ["src", "."]
project-includes = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["B", "E501", "I", "SIM", "UP", "ANN", "PYI"]
preview = true

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
