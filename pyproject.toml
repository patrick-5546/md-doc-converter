[project]
name = "md-doc-converter"
version = "0.1.0"
description = "Convert Word, Excel and CSV documents to Markdown, and render Markdown to HTML and PDF"
readme = "README.md"
requires-python = ">=3.15,<3.16"
keywords = ["markdown", "docx", "excel", "csv", "pdf", "html", "pandoc", "mermaid", "katex"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "openpyxl>=3.1.5",
]

[project.scripts]
md-doc-converter = "md_doc_converter.__main__:main"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "hypothesis>=6.170.1",
    "pyrefly>=1.1.1",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-randomly>=5.0.0",
    "pytest-xdist>=3.8",
    "ruff>=0.15.20",
    "rumdl>=0.3.0",
    "shellcheck-py>=0.11.0.1",
    "ty>=0.0.56",
    "types-openpyxl>=3.1.5.20261017",
    "typos>=1.51.1",
    "zizmor>=1.31.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# setup supports Linux x86_64 only, so the lock resolves for it alone.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Lock only releases at least a week old, as Dependabot's cooldown waits for: most compromised
# releases are found and pulled within days. Mirrors that hold new releases for a week then have
# every locked release.
exclude-newer = "7 days"

[tool.uv.build-backend]
# npm's settings for locking the bundled manifests; setup copies only the manifests.
wheel-exclude = [".npmrc"]

[tool.pytest]
minversion = "9.1"
strict = true
# The core suite; the rendering suite, tests/rendering, needs the full toolchain.
testpaths = ["tests/unit", "tests/integration"]
addopts = ["-ra", "-p", "pytester"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source_pkgs = ["md_doc_converter"]
# Also measure the command line that tests run in a subprocess.
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1

[tool.pyrefly]
preset = "strict"
search-path = ["src", "."]
project-includes = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
    "ANN",
    "B",
    "C4",
    "E501",
    "FURB",
    "I",
    "PERF",
    "PGH",
    "PIE",
    "PLW1514",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RUF",
    "SIM",
    "UP",
]
# Stylistic preference for `ruff: ignore` over `noqa`, which other tools understand.
ignore = ["RUF105"]
preview = true

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.rumdl.MD013]
line-length = 100
# Table rows cannot wrap.
tables = false

[tool.typos.files]
extend-exclude = ["uv.lock", "src/md_doc_converter/toolchain/package-lock.json"]

[tool.typos.default]
# Test data: Unicode written as an escape or an entity, and a backslash marker in a path.
extend-ignore-re = ["Caf(?:&eacute;|\\\\xe9)", "SOURCEBS\\w*"]

[tool.typos.default.extend-words]
# OpenDocument (ODF) and its XSL-FO attributes; Word's FILLIN field.
ODF = "ODF"
fo = "fo"
FILLIN = "FILLIN"
