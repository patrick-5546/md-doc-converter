[project]
name = "md-doc-converter"
version = "0.1.0"
description = "Convert Word, Excel and CSV documents to Markdown, and render Markdown to HTML and PDF"
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["markdown", "docx", "excel", "csv", "pdf", "html", "pandoc", "mermaid", "katex"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    # DOCX alignment depends on this exact MarkItDown output, and so on mammoth, its Word
    # reader, which MarkItDown no longer limits to one release series.
    "markitdown[docx]==0.1.9",
    "mammoth~=1.13.0",
    "openpyxl>=3.1.5",
    "typing-extensions>=4.4",
]

[project.scripts]
md-doc-converter = "md_doc_converter.__main__:main"

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-xdist>=3.8",
    "ruff>=0.15.20",
    "ty>=0.0.56",
    "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# setup supports Linux x86_64 only, so the lock resolves for it alone.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest]
minversion = "9.1"
strict = true
# The core suite; the rendering suite, tests/rendering, needs the full toolchain.
testpaths = ["tests/unit", "tests/integration"]
addopts = ["-ra", "-p", "pytester"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source_pkgs = ["md_doc_converter"]
# Also measure the command line that tests run in a subprocess.
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1

[tool.pyrefly]
preset = "strict"
search-path = ["src", "."]
project-includes = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
    "ANN",
    "B",
    "C4",
    "E501",
    "I",
    "PGH",
    "PIE",
    "PLW1514",
    "PT",
    "PTH",
    "PYI",
    "RUF",
    "SIM",
    "UP",
]
# Stylistic preference for `ruff: ignore` over `noqa`, which other tools understand.
ignore = ["RUF105"]
preview = true

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
