# rumdl's rules for the Markdown that docx-to-md writes, which tests/integration/test_docx_workflow.py
# checks after every conversion.

[global]
disable = [
    # Word paragraphs are lines of any length.
    "MD013",
    # These follow the Word document: its headings, emphasis and alt text.
    "MD001",
    "MD024",
    "MD025",
    "MD026",
    "MD036",
    "MD041",
    "MD045",
    "MD059",
    # A link to a Word bookmark at the top of the document is "#".
    "MD042",
    # Conversion checks links and fragments itself, with Pandoc's identifiers.
    "MD051",
    "MD057",
]

[MD033]
# Tables that Markdown cannot write are minimal HTML; underline, highlights, subscripts,
# superscripts and line breaks in cells stay tags; and so does emphasis that Markdown would
# not read as such.
allowed-elements = [
    "a", "br", "caption", "code", "del", "em", "h1", "h2", "h3", "h4", "h5", "h6", "hr", "img",
    "li", "mark", "ol", "p", "pre", "strong", "sub", "sup", "table", "tbody", "td", "th",
    "thead", "tr", "u", "ul",
]
