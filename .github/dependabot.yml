version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before adopting a new release.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]

  # The npm packages that `md-doc-converter setup` installs for rendering.
  - package-ecosystem: npm
    directory: /src/md_doc_converter/toolchain
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      renderer:
        update-types: [minor, patch]
