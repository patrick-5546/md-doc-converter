name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request supersedes its run in progress; runs on main all finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail instead of updating uv.lock, including in the uv runs that make starts.
  UV_LOCKED: "1"

jobs:
  lint-and-core:
    name: Lint and core tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - name: Cache Pandoc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain/bin/pandoc
          key: pandoc-${{ runner.os }}-${{ hashFiles('src/md_doc_converter/toolchain/install.py') }}
      - name: Lint
        env:
          # zizmor's online audits check the pinned actions against GitHub.
          GH_TOKEN: ${{ github.token }}
        run: make lint
      - name: Core tests
        # Installs the pinned Pandoc first (setup --no-render), unless it is cached.
        run: make test

  render:
    name: Rendering tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Where apt keeps the cached package files: outside the home folder, which apt's
      # download user cannot enter.
      APT_ARCHIVES: /tmp/apt-archives
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Ubuntu mirror is sometimes slow enough to exhaust the job's time limit, so the
      # package files are cached, keyed by the exact files that apt resolves.
      - name: List the LibreOffice and Poppler packages
        id: packages
        run: |
          sudo apt-get update
          sudo apt-get install --print-uris -qq --no-install-recommends \
            libreoffice-draw poppler-utils | grep "^'" | cut -d ' ' -f 2 | sort > "$RUNNER_TEMP/packages.txt"
          echo "digest=$(sha256sum < "$RUNNER_TEMP/packages.txt" | cut -c 1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the package files
        id: package-files
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.APT_ARCHIVES }}
          key: apt-${{ runner.os }}-${{ steps.packages.outputs.digest }}
          restore-keys: apt-${{ runner.os }}-
      - name: Install LibreOffice and Poppler
        run: |
          mkdir -p "$APT_ARCHIVES"
          sudo apt-get install --yes --no-install-recommends \
            -o Dir::Cache::Archives="$APT_ARCHIVES" libreoffice-draw poppler-utils
          # Keep only current package files, readable by the cache, without apt's lock.
          sudo apt-get autoclean -qq -o Dir::Cache::Archives="$APT_ARCHIVES"
          sudo rm -rf "$APT_ARCHIVES/lock" "$APT_ARCHIVES/partial"
          sudo chown -R "$(id -u):$(id -g)" "$APT_ARCHIVES"
      - name: Save the package files
        if: steps.package-files.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.APT_ARCHIVES }}
          key: ${{ steps.package-files.outputs.cache-primary-key }}
      - name: Allow the browser sandbox
        # Ubuntu 23.10 and later restrict the unprivileged user namespaces that Chrome's sandbox uses.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Cache the toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('src/md_doc_converter/toolchain/package.json', 'src/md_doc_converter/toolchain/package-lock.json', 'src/md_doc_converter/toolchain/environment.py', 'src/md_doc_converter/toolchain/install.py') }}
      - name: Rendering tests
        # Runs setup first, which installs whatever the cache did not restore.
        run: make test-render

  package:
    name: Build and install check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build
        run: uv build
      - name: Check the wheel contents
        run: |
          python3 -m zipfile -l dist/*.whl > wheel-contents.txt
          for file in \
              md_doc_converter/__main__.py \
              md_doc_converter/assets/pandoc-defaults.yaml \
              md_doc_converter/assets/mermaid.lua \
              md_doc_converter/assets/katex.js \
              md_doc_converter/assets/style-overrides.css \
              md_doc_converter/rendering/print-pdf.mjs \
              md_doc_converter/toolchain/package.json \
              md_doc_converter/toolchain/package-lock.json; do
            grep -q "^$file " wheel-contents.txt || { echo "missing from wheel: $file"; exit 1; }
          done
          if grep -vE '^(File Name|md_doc_converter/|md_doc_converter-[^/]+\.dist-info/)' wheel-contents.txt; then
            echo "unexpected files in wheel"
            exit 1
          fi
      - name: Install the wheel and run it outside the checkout
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          uv tool install dist/*.whl
          cd "$RUNNER_TEMP"
          "$UV_TOOL_BIN_DIR/md-doc-converter" --version
          "$UV_TOOL_BIN_DIR/md-doc-converter" --help
          printf 'Name,Value\nalpha,1\n' > sample.csv
          "$UV_TOOL_BIN_DIR/md-doc-converter" csv-to-md sample.csv
          grep -q '| alpha | 1 |' sample.md
